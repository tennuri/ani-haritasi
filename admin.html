<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<title>Anı Haritası · Moderasyon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #e9eff1; --panel: #ffffff; --ink: #1b2830; --muted: #56666e; --line: #d6e0e4;
  --accent: #b3203a; --accent-soft: #f6dde2; --ok: #1f7a4d; --ok-soft: #dcefe4; --warn: #8a5a00; --warn-soft: #f6ead0;
  --display: "Instrument Serif", Georgia, serif; --body: "Figtree", system-ui, sans-serif; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d; --panel: #15222a; --ink: #e4ecef; --muted: #93a6ae; --line: #26363f;
    --accent: #ff5d74; --accent-soft: #3d1d26; --ok: #5fd39a; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d; --panel: #15222a; --ink: #e4ecef; --muted: #93a6ae; --line: #26363f;
  --accent: #ff5d74; --accent-soft: #3d1d26; --ok: #5fd39a; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2f14; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 400 clamp(30px, 5vw, 42px)/1 var(--display); margin: 0; }
h1 em { color: var(--accent); }
.muted { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { color: var(--ok); border-color: var(--ok); }
.btn.danger { color: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=email], input[type=password], input[type=number] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; }
#login { max-width: 360px; display: grid; gap: 12px; }
.err { color: var(--accent); font-size: 14px; min-height: 1.5em; margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 14px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kinds { display: flex; gap: 0; margin-bottom: 10px; }
.kinds button { border: 1px solid var(--ink); background: var(--panel); padding: 6px 16px; font-weight: 600; }
.kinds button:first-child { border-radius: 8px 0 0 8px; }
.kinds button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
.kinds button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.parent { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }
.switch { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
.list { display: grid; gap: 10px; }
.mem { display: grid; gap: 8px; }
.mem .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.mem p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.mem img { max-width: min(100%, 360px); border-radius: 8px; display: block; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.badge.published { background: var(--ok-soft); color: var(--ok); }
.badge.pending { background: var(--warn-soft); color: var(--warn); }
.badge.hidden { background: var(--accent-soft); color: var(--accent); }
.badge.rep { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
a { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.stats-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.range { display: flex; gap: 4px; }
.range button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
.range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 600 26px/1.15 var(--body); font-variant-numeric: tabular-nums; }
.tile .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
.chart .bar { fill: var(--accent); }
.chart .bar.dim { opacity: .35; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.lists h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.rowbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 14px; margin-bottom: 6px; }
.rowbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowbar .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.rowbar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.rowbar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Anı Haritası <em>moderasyon</em></h1>
    <div class="actions"><a href="./">Haritaya dön</a><button class="btn" id="logout" hidden>Çıkış</button></div>
  </header>

  <form id="login" class="card" hidden>
    <p class="muted" style="margin:0">Supabase'de açtığın yönetici e-postası ve şifresiyle gir.</p>
    <label>E-posta <input type="email" id="email" autocomplete="username" required></label>
    <label>Şifre <input type="password" id="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" id="loginBtn">Giriş yap</button>
  </form>

  <section id="panel" hidden>
    <div class="card" style="display:grid;gap:14px;margin-bottom:16px" id="stats">
      <div class="stats-head">
        <strong>Ziyaretçiler</strong>
        <div class="range" role="group" aria-label="Zaman aralığı">
          <button data-days="7" aria-pressed="false">7 gün</button><button data-days="30" aria-pressed="true">30 gün</button><button data-days="90" aria-pressed="false">90 gün</button>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div>
        <div class="muted" id="chartTitle">Günlük ziyaretçi</div>
        <div class="chart" id="chart"></div>
      </div>
      <div class="lists">
        <div><h3>Nereden geldiler</h3><div id="refs"></div></div>
        <div><h3>En çok açılan sayfalar</h3><div id="pages"></div></div>
        <div><h3>Cihaz</h3><div id="devices"></div></div>
      </div>
      <p class="muted" style="margin:0">Çerezsiz sayılır: aynı kişi aynı gün içinde bir kez sayılır, günler arasında takip edilmez.</p>
    </div>
    <div class="card" style="display:grid;gap:12px;margin-bottom:16px">
      <strong>Ayarlar</strong>
      <div class="settings">
        <label class="switch"><input type="checkbox" id="sApproval"> Yeni anılar ve yanıtlar onayımdan sonra yayınlansın</label>
        <label>Kaç şikâyette otomatik gizlensin <input type="number" id="sHide" min="1" max="999"></label>
        <label>Bir kişi saatte en fazla kaç anı bırakabilir <input type="number" id="sRate" min="1" max="999"></label>
        <label>Bir kişi saatte en fazla kaç yanıt yazabilir <input type="number" id="sReplyRate" min="1" max="999"></label>
      </div>
    </div>
    <div class="kinds" role="group" aria-label="İçerik türü">
      <button data-kind="memories" aria-pressed="true">Anılar</button><button data-kind="replies" aria-pressed="false">Yanıtlar</button>
    </div>
    <div class="tabs" role="group" aria-label="Görünüm">
      <button data-view="review" aria-pressed="true">İncelenecek</button>
      <button data-view="pending" aria-pressed="false">Onay bekleyen</button>
      <button data-view="hidden" aria-pressed="false">Gizlenen</button>
      <button data-view="published" aria-pressed="false">Yayında</button>
      <button data-view="all" aria-pressed="false">Tümü</button>
    </div>
    <p class="muted" id="count"></p>
    <div class="list" id="list"></div>
  </section>
  <p class="err" id="fatal"></p>
</div>
<div id="toast" hidden></div>

<script>
(() => {
  // index.html'deki ile aynı değerler. anon anahtarı herkese açık olabilir.
  const SUPABASE = { url: "https://iitctgsawviphtskvizt.supabase.co", anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpdGN0Z3Nhd3ZpcGh0c2t2aXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDg5NzAsImV4cCI6MjEwNjQyNDk3MH0.TfHpysUG8TSx1H12fFw-hUD33jCubzon0grMw-UIg7c" };
  const $ = (id) => document.getElementById(id);
  const SKEY = "ani-haritasi-admin";
  const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const fmtDate = (s) => { const [y, m, d] = s.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
  const STATUS = { published: "Yayında", pending: "Onay bekliyor", hidden: "Gizli" };

  let session = null;
  try { session = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch {}
  const save = () => { try { session ? sessionStorage.setItem(SKEY, JSON.stringify(session)) : sessionStorage.removeItem(SKEY); } catch {} };

  let toastT;
  function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400); }

  async function auth(grant, body) {
    const res = await fetch(`${SUPABASE.url}/auth/v1/token?grant_type=${grant}`, {
      method: "POST", headers: { apikey: SUPABASE.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status === 400 ? "E-posta ya da şifre yanlış." : (j.msg || j.error_description || "Giriş yapılamadı."));
    return { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 };
  }

  async function rpc(name, args) {
    if (session && Date.now() > session.exp - 60000) {
      try { session = await auth("refresh_token", { refresh_token: session.refresh }); save(); }
      catch { session = null; save(); showLogin(); throw new Error("Oturum süresi doldu, yeniden gir."); }
    }
    let res;
    try {
      res = await fetch(`${SUPABASE.url}/rest/v1/rpc/${name}`, {
        method: "POST",
        headers: { apikey: SUPABASE.anonKey, Authorization: "Bearer " + (session ? session.access : SUPABASE.anonKey), "Content-Type": "application/json" },
        body: JSON.stringify(args || {}),
      });
    } catch { throw new Error("Sunucuya ulaşılamadı."); }
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) {
      if (body && body.code === "P0001") throw new Error(body.message);
      if (body && body.code === "PGRST202") throw new Error("Veritabanı kurulumu eksik: schema.sql'i yeniden çalıştır.");
      throw new Error(`Sunucu isteği reddetti. [${res.status} ${(body && body.code) || ""} ${(body && body.message) || ""}]`);
    }
    return body;
  }

  function showLogin(msg) { $("login").hidden = false; $("panel").hidden = true; $("logout").hidden = true; $("loginErr").textContent = msg || ""; }

  async function enter() {
    let ok = false;
    try { ok = await rpc("admin_check"); } catch (e) { showLogin(e.message); return; }
    if (!ok) { session = null; save(); showLogin("Bu hesap yönetici değil. E-postanı admins tablosuna ekle."); return; }
    $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false;
    loadSettings(); load(); loadStats();
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn"); btn.disabled = true; $("loginErr").textContent = "";
    try { session = await auth("password", { email: $("email").value.trim(), password: $("password").value }); save(); await enter(); }
    catch (ex) { $("loginErr").textContent = ex.message; }
    finally { btn.disabled = false; }
  });

  $("logout").onclick = () => {
    if (session) fetch(`${SUPABASE.url}/auth/v1/logout`, { method: "POST", headers: { apikey: SUPABASE.anonKey, Authorization: "Bearer " + session.access } }).catch(() => {});
    session = null; save(); showLogin();
  };

  // ---- settings ----
  async function loadSettings() {
    try {
      const s = await rpc("admin_settings");
      $("sApproval").checked = s.require_approval === "true";
      $("sHide").value = s.hide_after_reports; $("sRate").value = s.max_posts_per_hour;
      $("sReplyRate").value = s.max_replies_per_hour || 15;
    } catch (e) { toast(e.message); }
  }
  const setSetting = (k, v) => rpc("admin_set_setting", { p_key: k, p_value: String(v) }).then(() => toast("Ayar kaydedildi")).catch((e) => { toast(e.message); loadSettings(); });
  $("sApproval").onchange = (e) => setSetting("require_approval", e.target.checked);
  $("sHide").onchange = (e) => setSetting("hide_after_reports", e.target.value);
  $("sRate").onchange = (e) => setSetting("max_posts_per_hour", e.target.value);
  $("sReplyRate").onchange = (e) => setSetting("max_replies_per_hour", e.target.value);

  // ---- visitor stats ----
  let statDays = 30, statTimer = null, lastDays = null, rsT;
  window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (lastDays && !$("panel").hidden) chart(lastDays); }, 150); });
  const nf = new Intl.NumberFormat("tr-TR");
  const shortDate = (s) => { const [, m, d] = s.split("-").map(Number); return `${d} ${MONTHS[m - 1].slice(0, 3)}`; };
  document.querySelectorAll(".range button").forEach((b) => b.onclick = () => {
    statDays = +b.dataset.days;
    document.querySelectorAll(".range button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    loadStats();
  });
  function tile(k, v, live) {
    const d = document.createElement("div"); d.className = "tile";
    d.innerHTML = `<div class="k"></div><div class="v"></div>`;
    d.querySelector(".k").textContent = k;
    if (live) { const dot = document.createElement("span"); dot.className = "live"; d.querySelector(".k").prepend(dot); }
    d.querySelector(".v").textContent = nf.format(v);
    return d;
  }
  function rowbars(box, rows, key, empty) {
    box.innerHTML = "";
    if (!rows.length) { box.innerHTML = `<p class="muted" style="margin:0">${empty}</p>`; return; }
    const max = Math.max(...rows.map((r) => r[key]));
    for (const r of rows) {
      const el = document.createElement("div"); el.className = "rowbar";
      el.innerHTML = `<span class="name"></span><span class="n"></span><div class="track"><div class="fill"></div></div>`;
      el.querySelector(".name").textContent = r.name; el.querySelector(".name").title = r.name;
      el.querySelector(".n").textContent = nf.format(r[key]);
      el.querySelector(".fill").style.width = Math.max(2, r[key] / max * 100) + "%";
      box.appendChild(el);
    }
  }
  function chart(days) {
    const box = $("chart"); box.innerHTML = ""; lastDays = days;
    const Wd = Math.max(260, box.clientWidth || 600), Ht = 180, padL = 30, padB = 22, padT = 8, n = days.length;
    const max = Math.max(1, ...days.map((d) => d.visitors));
    const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
    const x = (i) => padL + (Wd - padL) * i / n, bw = Math.max(2, (Wd - padL) / n - 2);
    const y = (v) => padT + (Ht - padT - padB) * (1 - v / top);
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${Wd} ${Ht}`);
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", `Son ${n} günde günlük ziyaretçi sayısı`);
    const add = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; };
    for (const v of [0, top / 2, top]) { add("line", { class: "grid", x1: padL, x2: Wd, y1: y(v), y2: y(v) }); add("text", { class: "axis", x: padL - 6, y: y(v) + 4, "text-anchor": "end" }, nf.format(v)); }
    const every = Math.ceil(n / Math.max(2, Math.floor(Wd / 90)));
    days.forEach((d, i) => {
      const h = Math.max(0, y(0) - y(d.visitors));
      if (d.visitors > 0) add("path", { class: "bar", d: `M${x(i) + 1},${y(0)} v${-(h - Math.min(4, h))} q0,${-Math.min(4, h)} ${Math.min(4, bw / 2)},${-Math.min(4, h)} h${bw - 2 * Math.min(4, bw / 2)} q${Math.min(4, bw / 2)},0 ${Math.min(4, bw / 2)},${Math.min(4, h)} v${h - Math.min(4, h)} z` });
      if ((i % every === 0 && n - 1 - i >= every * 0.7) || i === n - 1) add("text", { class: "axis", x: i === n - 1 ? Wd : x(i) + 1 + bw / 2, y: Ht - 6, "text-anchor": i === n - 1 ? "end" : "middle" }, shortDate(d.day));
      const hit = add("rect", { class: "hit", x: x(i), y: padT, width: (Wd - padL) / n, height: Ht - padT - padB });
      hit.addEventListener("pointerenter", () => showTip(i));
    });
    svg.addEventListener("pointerleave", () => { tip.hidden = true; });
    box.appendChild(svg);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    function showTip(i) {
      const d = days[i];
      tip.innerHTML = ""; const b = document.createElement("b"); b.textContent = fmtDate(d.day); tip.append(b, document.createElement("br"),
        `${nf.format(d.visitors)} ziyaretçi · ${nf.format(d.views)} görüntülenme`, document.createElement("br"), `${nf.format(d.memories)} yeni anı`);
      tip.hidden = false;
      const half = tip.offsetWidth / 2, cx = x(i) + 1 + bw / 2;
      tip.style.left = Math.min(Wd - half, Math.max(half, cx)) + "px"; tip.style.top = (y(d.visitors) - 6) + "px";
    }
  }
  async function loadStats() {
    clearTimeout(statTimer);
    let s;
    try { s = await rpc("admin_stats", { p_days: statDays }); }
    catch (e) { $("tiles").innerHTML = ""; const p = document.createElement("p"); p.className = "muted"; p.textContent = e.message; $("tiles").appendChild(p); return; }
    const days = s.days || [], today = days[days.length - 1] || { visitors: 0 };
    const sum = (k, from) => days.slice(from).reduce((a, d) => a + d[k], 0);
    const tiles = $("tiles"); tiles.innerHTML = "";
    tiles.append(tile("Şu an sitede", s.now, true), tile("Bugün ziyaretçi", today.visitors), tile(`${statDays} günde ziyaretçi`, sum("visitors", 0)),
      tile(`${statDays} günde görüntülenme`, sum("views", 0)), tile(`${statDays} günde yeni anı`, sum("memories", 0)), tile("Yayındaki anı", s.memories_total));
    $("chartTitle").textContent = `Günlük ziyaretçi, son ${statDays} gün`;
    chart(days);
    rowbars($("refs"), s.referrers, "visitors", "Henüz başka siteden gelen yok.");
    rowbars($("pages"), s.pages.map((p) => ({ ...p, name: p.name === "/" ? "Ana sayfa" : p.name.replace(/^\//, "") })), "views", "Henüz veri yok.");
    const dv = s.devices || {}; rowbars($("devices"), Object.keys(dv).map((k) => ({ name: k[0].toUpperCase() + k.slice(1), n: dv[k] })).sort((a, b) => b.n - a.n), "n", "Henüz veri yok.");
    statTimer = setTimeout(() => { if (!$("panel").hidden) loadStats(); }, 60000);
  }

  // ---- list ----
  let view = "review";
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    view = b.dataset.view;
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load();
  });

  let kind = "memories";
  document.querySelectorAll(".kinds button").forEach((b) => b.onclick = () => {
    kind = b.dataset.kind;
    document.querySelectorAll(".kinds button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load();
  });

  async function load() {
    const box = $("list"); box.innerHTML = '<p class="empty">Yükleniyor…</p>';
    const isR = kind === "replies", noun = isR ? "yanıt" : "anı";
    let rows;
    try { rows = await rpc(isR ? "admin_replies" : "admin_memories", { p_view: view }); } catch (e) { box.innerHTML = ""; $("count").textContent = e.message; return; }
    $("count").textContent = rows.length ? `${rows.length} ${noun}` : "";
    box.innerHTML = "";
    if (!rows.length) { box.innerHTML = `<p class="empty">Burada bekleyen ${noun} yok.</p>`; return; }
    for (const m of rows) box.appendChild(isR ? replyCard(m) : card(m));
  }

  function replyCard(r) {
    const el = document.createElement("article"); el.className = "card mem";
    const meta = document.createElement("div"); meta.className = "meta";
    const badge = document.createElement("span"); badge.className = "badge " + r.status; badge.textContent = STATUS[r.status] || r.status;
    meta.appendChild(badge);
    if (r.reports > 0) { const x = document.createElement("span"); x.className = "badge rep"; x.textContent = `${r.reports} şikâyet`; meta.appendChild(x); }
    const t = document.createElement("span"); t.textContent = "yazıldı " + new Date(r.created_at).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" }); meta.appendChild(t);
    el.appendChild(meta);
    const parent = document.createElement("div"); parent.className = "parent";
    parent.textContent = `Yanıtlanan anı (${r.memory_city || "?"}): ${r.memory_text || ""}`;
    el.appendChild(parent);
    const p = document.createElement("p"); p.textContent = r.text; el.appendChild(p);
    const actions = document.createElement("div"); actions.className = "actions";
    const setStatus = (s, msg) => async () => { await rpc("admin_set_reply_status", { p_id: r.id, p_status: s }); toast(msg); load(); };
    if (r.status !== "published") actions.appendChild(btn("Yayınla", "ok", setStatus("published", "Yanıt yayında")));
    else if (r.reports > 0) actions.appendChild(btn("Sorun yok, şikâyetleri sil", "ok", setStatus("published", "Şikâyetler temizlendi")));
    if (r.status !== "hidden") actions.appendChild(btn("Gizle", "", setStatus("hidden", "Yanıt gizlendi")));
    actions.appendChild(btn("Sil", "danger", async () => { await rpc("admin_delete_reply", { p_id: r.id }); toast("Yanıt silindi"); load(); }, "Emin misin? Kalıcı sil"));
    el.appendChild(actions);
    return el;
  }

  function btn(label, cls, fn, confirmLabel) {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn " + (cls || ""); b.textContent = label;
    b.onclick = async () => {
      if (confirmLabel && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = confirmLabel; return; }
      b.disabled = true;
      try { await fn(); } catch (e) { toast(e.message); b.disabled = false; }
    };
    return b;
  }

  function card(m) {
    const el = document.createElement("article"); el.className = "card mem";
    const meta = document.createElement("div"); meta.className = "meta";
    const badge = document.createElement("span"); badge.className = "badge " + m.status; badge.textContent = STATUS[m.status] || m.status;
    meta.appendChild(badge);
    if (m.reports > 0) { const r = document.createElement("span"); r.className = "badge rep"; r.textContent = `${m.reports} şikâyet`; meta.appendChild(r); }
    const d = document.createElement("span"); d.textContent = fmtDate(m.date); meta.appendChild(d);
    const where = document.createElement("a"); where.target = "_blank"; where.rel = "noopener";
    where.href = `https://www.openstreetmap.org/?mlat=${m.lat}&mlon=${m.lng}#map=18/${m.lat}/${m.lng}`;
    where.textContent = (m.place ? m.place + " · " : "") + m.city; meta.appendChild(where);
    if (m.mood) { const c = document.createElement("span"); c.textContent = m.mood; meta.appendChild(c); }
    const t = document.createElement("span"); t.textContent = "eklendi " + new Date(m.created_at).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" }); meta.appendChild(t);
    el.appendChild(meta);
    const p = document.createElement("p"); p.textContent = m.text; el.appendChild(p);

    const actions = document.createElement("div"); actions.className = "actions";
    if (m.has_photo) {
      actions.appendChild(btn("Fotoğrafı göster", "", async () => {
        const src = await rpc("admin_photo", { p_id: m.id });
        if (src && src.startsWith("data:image/")) { const img = document.createElement("img"); img.alt = "Anının fotoğrafı"; img.src = src; el.insertBefore(img, actions); }
        else toast("Fotoğraf bulunamadı");
      }));
    }
    const setStatus = (s, msg) => async () => { await rpc("admin_set_status", { p_id: m.id, p_status: s }); toast(msg); load(); };
    if (m.status !== "published") actions.appendChild(btn("Yayınla", "ok", setStatus("published", "Anı yayında")));
    else if (m.reports > 0) actions.appendChild(btn("Sorun yok, şikâyetleri sil", "ok", setStatus("published", "Şikâyetler temizlendi")));
    if (m.status !== "hidden") actions.appendChild(btn("Gizle", "", setStatus("hidden", "Anı gizlendi")));
    actions.appendChild(btn("Sil", "danger", async () => { await rpc("admin_delete", { p_id: m.id }); toast("Anı silindi"); load(); }, "Emin misin? Kalıcı sil"));
    el.appendChild(actions);
    return el;
  }

  if (session) enter(); else showLogin();
})();
</script>
</body>
</html>
